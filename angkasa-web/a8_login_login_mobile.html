  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen antialiased relative overflow-x-hidden"><div class="pointer-events-none fixed inset-0 z-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-surface-container-highest/60 via-surface/40 to-surface"></div><main class="flex flex-col relative z-10 w-full min-h-screen pt-safe pb-safe bg-transparent"><div class="flex flex-col w-full px-5 py-6 items-center justify-center relative">
<!-- Soft Ambient Glow Orbs -->
<div class="absolute -top-12 -left-10 w-56 h-56 rounded-full bg-secondary-fixed-dim/35 blur-3xl pointer-events-none"></div>
<div class="absolute top-1/3 -right-12 w-64 h-64 rounded-full bg-surface-container-highest/60 blur-3xl pointer-events-none"></div>
<!-- Brand Identity Header -->
<div class="flex flex-col items-center text-center mb-7 relative z-10">
<div class="w-16 h-16 rounded-2xl bg-surface-container-lowest shadow-md flex items-center justify-center mb-3.5 relative">
<div class="absolute inset-0 rounded-2xl bg-gradient-to-br from-secondary-fixed/40 to-transparent pointer-events-none"></div>
<svg class="w-9 h-9" fill="none" viewbox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient gradientunits="userSpaceOnUse" id="angkasaGlow" x1="4" x2="32" y1="4" y2="32">
<stop offset="0%" stop-color="#2A2545"></stop>
<stop offset="60%" stop-color="#5854A6"></stop>
<stop offset="100%" stop-color="#8E8AE0"></stop>
</lineargradient>
<lineargradient gradientunits="userSpaceOnUse" id="subtleSparkle" x1="0" x2="16" y1="0" y2="16">
<stop offset="0%" stop-color="#ABA7FF"></stop>
<stop offset="100%" stop-color="#5854A6"></stop>
</lineargradient>
</defs>
<!-- Main 4-Pointed Star -->
<path d="M18 2C18 10.8366 10.8366 18 2 18C10.8366 18 18 25.1634 18 34C18 25.1634 25.1634 18 34 18C25.1634 18 18 10.8366 18 2Z" fill="url(#angkasaGlow)"></path>
<!-- Floating Micro Sparkle -->
<path d="M29 6C29 8.20914 27.2091 10 25 10C27.2091 10 29 11.7909 29 14C29 11.7909 30.7909 10 33 10C30.7909 10 29 8.20914 29 6Z" fill="url(#subtleSparkle)"></path>
<circle cx="7" cy="28" fill="#8E8AE0" opacity="0.8" r="1.5"></circle>
</svg>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight font-medium mb-1">
      Angkasa
    </h1>
<div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-surface-container-high/80">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-semibold">
        PANEL ADMIN OPERATOR
      </span>
</div>
</div>
<!-- Main Card Surface (Airy & Tactile) -->
<div class="w-full max-w-[390px] bg-surface-container-lowest rounded-[24px] shadow-lg shadow-primary-container/5 p-6 flex flex-col relative z-10">
<!-- Header Message -->
<div class="mb-6">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-medium tracking-tight mb-2">
        Masuk ke <span class="text-secondary-container">Admin</span> Panel
      </h2>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
        Kelola kiosk photobooth, katalog preset, dan pantau sesi real-time.
      </p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-4" id="adminLoginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium ml-1" for="adminEmail">
          ID Operator / Surel
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/60 text-[20px] pointer-events-none">
            mail
          </span>
<input class="w-full h-[52px] rounded-full bg-surface-container-low pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-md focus:shadow-secondary/10" id="adminEmail" placeholder="nama@angkasa.id" required="" type="email" value="operator@angkasa.id"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="adminPassword">
            Kata Sandi
          </label>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/60 text-[20px] pointer-events-none">
            lock
          </span>
<input class="w-full h-[52px] rounded-full bg-surface-container-low pl-12 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-md focus:shadow-secondary/10" id="adminPassword" placeholder="••••••••••••" required="" type="password" value="angkasastudio2025"/>
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-3.5 w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant/60 hover:text-on-surface transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordEyeIcon">
              visibility
            </span>
</button>
</div>
</div>
<!-- Remember Device Pill & Forgot Password -->
<div class="flex items-center justify-between mt-1 px-1">
<label class="flex items-center gap-2 cursor-pointer select-none group py-1">
<div class="relative flex items-center justify-center">
<input checked="" class="sr-only peer" id="rememberDevice" type="checkbox"/>
<div class="w-5 h-5 rounded-lg bg-surface-container-high transition-all duration-200 peer-checked:bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[15px] opacity-0 peer-checked:opacity-100 transition-opacity">
                check
              </span>
</div>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">
            Ingat perangkat kiosk
          </span>
</label>
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors font-medium" href="#forgot-password" onclick="event.preventDefault(); showResetAlert();">
          Lupa sandi?
        </a>
</div>
<!-- Primary Action Button -->
<button class="w-full h-[52px] mt-3 rounded-full bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg tracking-wide flex items-center justify-center gap-2 shadow-lg shadow-primary-container/25 active:scale-[0.98] transition-all duration-200" id="loginSubmitBtn" type="submit">
<span>Masuk ke Dashboard</span>
<span class="material-symbols-outlined text-[18px]">
          arrow_forward
        </span>
</button>
</form>
<!-- Quick Feedback Banner Container (Hidden Initially) -->
<div class="hidden mt-4 p-3 rounded-2xl bg-secondary-fixed/50 flex items-center gap-2.5 transition-all" id="statusToast">
<span class="material-symbols-outlined text-secondary text-[20px]">info</span>
<span class="font-label-sm text-label-sm text-on-secondary-fixed font-medium" id="statusToastMessage"></span>
</div>
</div>
<!-- Operational Hardware Details / Status Badge -->
<div class="w-full max-w-[390px] mt-6 flex flex-col items-center gap-2 relative z-10">
<div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-surface-container-lowest/80 shadow-sm">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">
        v2.4.12 • Kiosk Senopati-01 Terhubung
      </span>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant/60 text-center">
      Hak Cipta © 2025 PT Angkasa Fotografi Indonesia
    </p>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('adminPassword');
    const eyeIcon = document.getElementById('passwordEyeIcon');
    if (!passwordInput || !eyeIcon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLoginSubmit() {
    const btn = document.getElementById('loginSubmitBtn');
    const toast = document.getElementById('statusToast');
    const toastMsg = document.getElementById('statusToastMessage');
    
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Mengotentikasi...</span>';
    }

    setTimeout(() => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk ke Dashboard</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
      }
      if (toast && toastMsg) {
        toastMsg.textContent = 'Koneksi terverifikasi. Mengarahkan ke konsol kiosk Senopati...';
        toast.classList.remove('hidden');
        setTimeout(() => {
          toast.classList.add('hidden');
        }, 4000);
      }
    }, 1100);
  }

  function showResetAlert() {
    const toast = document.getElementById('statusToast');
    const toastMsg = document.getElementById('statusToastMessage');
    if (toast && toastMsg) {
      toastMsg.textContent = 'Silakan hubungi IT Lead (@angkasa.ops) untuk reset token PIN operator.';
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 5000);
    }
  }
</script></main><script src="router.js"></script></body></html>

  // Micro-interaction delight: Simulated smooth sync transition after connection settles
  document.addEventListener('DOMContentLoaded', () => {
    const feedbackPhases = [
      "Menyinkronkan 4 pose dari Kiosk Booth #01",
      "Mengoptimalkan resolusi strip foto...",
      "Memuat palet stiker & filter dekorasi...",
      "Hampir siap! Menyiapkan kanvas..."
    ];
    let step = 0;
    const descNode = document.querySelector('p.font-body-md');
    if (descNode) {
      setInterval(() => {
        step = (step + 1) % feedbackPhases.length;
        descNode.style.opacity = '0';
        setTimeout(() => {
          descNode.textContent = feedbackPhases[step];
          descNode.style.opacity = '1';
        }, 250);
      }, 3200);
      descNode.style.transition = 'opacity 0.25s ease';
    }
  });

<script>
  (function initTextEditor() {
    const displayText = document.getElementById('canvas-text-display');
    const inputMirror = document.getElementById('input-mirror-text');
    let currentString = "Best Day Ever";

    function updateText(val) {
      currentString = val;
      displayText.textContent = currentString.length > 0 ? currentString : 'Ketik teks...';
      inputMirror.textContent = currentString.length > 0 ? currentString : 'Ketik teks...';
      if (currentString.length === 0) {
        displayText.classList.add('opacity-40');
        inputMirror.classList.add('text-on-surface-variant');
      } else {
        displayText.classList.remove('opacity-40');
        inputMirror.classList.remove('text-on-surface-variant');
      }
    }

    // Key input handlers
    document.querySelectorAll('.key-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        updateText(currentString + btn.textContent.trim());
      });
    });

    const spaceBtn = document.getElementById('key-space');
    if (spaceBtn) {
      spaceBtn.addEventListener('click', () => {
        updateText(currentString + ' ');
      });
    }

    const backspaceBtn = document.getElementById('key-backspace');
    if (backspaceBtn) {
      backspaceBtn.addEventListener('click', () => {
        if (currentString.length > 0) {
          updateText(currentString.slice(0, -1));
        }
      });
    }

    const clearBtn = document.getElementById('clear-btn');
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        updateText('');
      });
    }

    // Color Swatches
    const swatches = document.querySelectorAll('.color-swatch');
    swatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        swatches.forEach(s => {
          s.classList.remove('scale-110');
          s.innerHTML = '';
        });
        swatch.classList.add('scale-110');
        swatch.innerHTML = '<span class="w-3 h-3 rounded-full bg-secondary"></span>';
        
        const color = swatch.getAttribute('data-color');
        if (color === '#ffffff') {
          displayText.style.color = '#ffffff';
          displayText.style.textShadow = '0 2px 8px rgba(21,16,47,0.7)';
        } else {
          displayText.style.color = color;
          displayText.style.textShadow = '0 1px 4px rgba(0,0,0,0.3)';
        }
      });
    });

    // Font family pills
    const fontChips = document.querySelectorAll('.font-chip');
    fontChips.forEach(chip => {
      chip.addEventListener('click', () => {
        fontChips.forEach(c => {
          c.classList.remove('bg-secondary', 'text-on-secondary');
          c.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
        chip.classList.add('bg-secondary', 'text-on-secondary');
        
        const fontName = chip.getAttribute('data-font');
        if (fontName === 'Caveat') {
          displayText.style.fontFamily = 'cursive';
        } else if (fontName === 'Playfair') {
          displayText.style.fontFamily = 'serif';
        } else if (fontName === 'Anton') {
          displayText.style.fontFamily = 'impact, sans-serif';
        } else {
          displayText.style.fontFamily = 'Plus Jakarta Sans, sans-serif';
        }
      });
    });

    // Shadow toggle
    const shadowBtn = document.getElementById('shadow-btn');
    let hasShadow = true;
    if (shadowBtn) {
      shadowBtn.addEventListener('click', () => {
        hasShadow = !hasShadow;
        if (hasShadow) {
          shadowBtn.classList.replace('bg-surface-container-low', 'bg-secondary-fixed');
          shadowBtn.classList.add('text-secondary');
          displayText.style.textShadow = '0 2px 8px rgba(21,16,47,0.7)';
        } else {
          shadowBtn.classList.replace('bg-secondary-fixed', 'bg-surface-container-low');
          shadowBtn.classList.remove('text-secondary');
          displayText.style.textShadow = 'none';
        }
      });
    }

    // Done confirmation
    const addBtn = document.getElementById('add-text-btn');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        const box = document.getElementById('active-text-box');
        if (box) {
          box.classList.add('ring-2', 'ring-secondary');
          setTimeout(() => box.classList.remove('ring-2', 'ring-secondary'), 600);
        }
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-4px_20px_rgba(42,37,69,0.06)]" data-active-classes="text-secondary bg-surface-container-high font-semibold"><div class="flex items-center justify-around h-16 px-space-xs"><a class="flex flex-col items-center justify-center min-w-[64px] h-12 rounded-full px-2 text-on-surface-variant hover:text-on-surface transition-colors" data-path="editor-stiker" href="#"><span class="material-symbols-outlined text-[22px]">mood</span><span class="font-label-sm text-label-sm mt-0.5">Stiker</span></a><a aria-current="page" class="flex flex-col items-center justify-center min-w-[64px] h-12 rounded-full px-2 transition-colors text-secondary bg-surface-container-high font-semibold" data-path="editor-teks" href="#"><span class="material-symbols-outlined text-[22px]">title</span><span class="font-label-sm text-label-sm mt-0.5">Teks</span></a><a class="flex flex-col items-center justify-center min-w-[64px] h-12 rounded-full px-2 text-on-surface-variant hover:text-on-surface transition-colors" data-path="editor-gambar" href="#"><span class="material-symbols-outlined text-[22px]">image</span><span class="font-label-sm text-label-sm mt-0.5">Gambar</span></a><a class="flex flex-col items-center justify-center min-w-[64px] h-12 rounded-full px-2 text-on-surface-variant hover:text-on-surface transition-colors" data-path="editor-lapisan" href="#"><span class="material-symbols-outlined text-[22px]">layers</span><span class="font-label-sm text-label-sm mt-0.5">Lapisan</span></a></div></nav><script src="router.js"></script></body></html>
